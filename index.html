<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Forge</title>
<style>
:root{--ob:#0A0A0A;--ob2:#101114;--ob3:#17181C;--ob4:#222328;--cyan:#00F2FF;--cd:rgba(0,242,255,.10);--cm:rgba(0,242,255,.22);--sb:rgba(192,192,192,.12);--sl:rgba(192,192,192,.05);--wht:#F0F0F0;--w2:#D4D4D4;--w3:#A8A8A8;--hlo:#1D9E75;--hmd:#7F77DD;--hhi:#ED4FBA;--grn:#39E07A;--red:#FF4D6A;--amb:#FFB833}

.lsv{margin-top:8px;font-size:13px;color:var(--w3)}.lsv button{background:none;border:none;color:var(--cyan);cursor:pointer;font-size:13px;padding:4px 8px;font-family:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 0 10px;border-bottom:1px solid var(--sb);margin-bottom:12px}.top h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}.top h1 img{height:28px}

.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}

.sec{display:none}.sec.a{display:block}
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.mc{background:var(--ob3);border-radius:8px;padding:10px;border:1px solid var(--sb)}.mc .l{font-size:11px;color:var(--w3)}.mc .v{font-size:18px;font-weight:600;margin-top:2px}

.bw{background:rgba(237,79,186,.15);color:#ED4FBA}.bg2{background:rgba(57,224,122,.15);color:var(--grn)}.bb{background:var(--cd);color:var(--cyan)}.ba{background:rgba(255,184,51,.15);color:var(--amb)}.bp{background:rgba(127,119,221,.15);color:#AFA9EC}.bt{background:rgba(29,158,117,.15);color:#5DCAA5}

.hlg{display:flex;flex-direction:column;gap:2px;justify-content:center;padding-top:40px;align-items:center}.hlg-bar{width:6px;height:80px;border-radius:3px;background:linear-gradient(to top,#1D9E75,#7F77DD,#ED4FBA)}.hlg span{font-size:9px;color:var(--w3)}

.tb{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--ob3);border:1px solid var(--cm);border-radius:8px;margin:10px 0}.tb .tm{font-size:20px;font-weight:600;font-family:monospace;color:var(--cyan)}
.bs{font-size:12px;padding:6px 12px;border:1px solid var(--sb);border-radius:6px;background:transparent;cursor:pointer;color:var(--wht);font-family:inherit;min-height:36px}.bs:active{transform:scale(.97)}
.bsa{background:var(--cyan);color:var(--ob);border-color:var(--cyan);font-weight:600}

.tp{width:40px;height:22px;border-radius:11px;background:var(--ob4);border:1px solid var(--sb);position:relative;cursor:pointer;flex-shrink:0}.tp.on{background:var(--grn);border-color:var(--grn)}.tp .dt{width:18px;height:18px;border-radius:50%;background:var(--wht);position:absolute;top:1px;left:1px;transition:transform .2s}.tp.on .dt{transform:translateX(18px)}
.cg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.cf{display:flex;flex-direction:column;gap:4px}.cf label{font-size:12px;color:var(--w2)}

.wr{font-size:11px;color:var(--w3);padding:3px 7px;background:var(--ob4);border-radius:4px}
.tts{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}
.tt{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--sb);background:transparent;cursor:pointer;color:var(--w3);font-family:inherit;min-height:32px}.tt.a{background:var(--cyan);color:var(--ob);border-color:var(--cyan);font-weight:600}

.dtab-add{font-size:11px;padding:6px 10px;border:1px dashed var(--sb);border-radius:8px;cursor:pointer;color:var(--w3);font-family:inherit;min-height:36px;background:transparent}
.wdh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.wdh input{font-size:16px;padding:8px 10px;border:1px solid var(--sb);border-radius:6px;background:var(--ob3);color:var(--cyan);font-family:inherit;flex:1;min-height:44px;font-weight:600}.wdh input:focus{border-color:var(--cyan);outline:none}
.done-btn{font-size:14px;padding:12px;background:var(--grn);color:var(--ob);border:none;border-radius:10px;cursor:pointer;font-weight:600;font-family:inherit;min-height:48px;width:100%;margin-top:12px}.done-btn:active{transform:scale(.97)}
.save-btn{font-size:14px;padding:12px;background:var(--cyan);color:var(--ob);border:none;border-radius:10px;cursor:pointer;font-weight:600;font-family:inherit;min-height:48px;width:100%;margin-top:12px}.save-btn:active{transform:scale(.97)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px}
.cal-hd{text-align:center;color:var(--w3);padding:4px;font-weight:600}

.cal-day .dn{color:var(--w2);font-size:11px;margin-bottom:2px}.cal-day .dw{font-size:8px;color:var(--cyan);line-height:1.2;word-break:break-word}

.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.cal-nav button{background:none;border:1px solid var(--sb);border-radius:6px;color:var(--wht);padding:6px 12px;cursor:pointer;font-family:inherit;min-height:36px}.cal-nav span{font-size:14px;font-weight:600}
.wt-row{display:flex;gap:4px;align-items:center;margin-top:4px;flex-wrap:wrap}

.fsel{font-size:16px;padding:10px 12px;border:1px solid var(--sb);border-radius:8px;background:var(--ob3);color:var(--wht);font-family:inherit;width:100%;min-height:44px;-webkit-appearance:none;cursor:pointer}.fsel:focus{border-color:var(--cyan);outline:none}
.nc-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--ob3);border-radius:8px;font-size:13px;border:1px solid var(--sl);min-height:44px;margin-bottom:6px}

.sync-bar .dot.ok{background:var(--grn)}.sync-bar .dot.off{background:var(--red)}

.ss-group{border-left:2px solid var(--cyan);padding-left:10px;margin:6px 0;border-radius:2px}
.ss-label{font-size:11px;color:var(--cyan);font-weight:600;margin-bottom:4px}

.tip{position:relative;cursor:help;border-bottom:1px dotted var(--w3)}.tip:hover .tiptext,.tip:active .tiptext{visibility:visible;opacity:1}
.tiptext{visibility:hidden;opacity:0;background:var(--ob4);color:var(--wht);font-size:11px;padding:6px 10px;border-radius:6px;border:1px solid var(--sb);position:absolute;bottom:120%;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:50;transition:opacity .15s;pointer-events:none;font-weight:400;max-width:220px;white-space:normal;text-align:center}

.ex-card{background:var(--ob3);border:1px solid var(--sb);border-radius:10px;padding:12px;margin-bottom:10px}

.set-label{font-size:11px;color:var(--w3);text-align:center;min-width:80px}
.ex-prev{font-size:11px;color:var(--w3);margin-top:4px;font-style:italic}

.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;padding:12px 28px;background:#fff;color:#333;border:1px solid #ddd;border-radius:10px;cursor:pointer;font-weight:500;font-family:inherit;min-height:48px;width:260px}

.set-input.regress{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}

.role-card{background:var(--ob3);border:2px solid var(--sb);border-radius:12px;padding:20px;text-align:center;cursor:pointer;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}

// Feature 3: Input focus/change handlers for styling
function onSetFocus(el,ei,si,field,prev){
  if(el.value===prev&&prev){el.value="";el.classList.remove("carried");el.classList.add("fresh")}
}
function onSetChange(el,ei,si,field,prev){
  const v=el.value;
  el.classList.remove("carried");el.classList.add("fresh");
  logSet(ei,si,field,v);
  // Trigger overload check - re-render is expensive so just update border
  if(field==="lbs"){
    const pn=parseFloat(prev),cn=parseFloat(v);
    el.classList.remove("progress","stalled","regress");
    if(prev&&v&&!isNaN(pn)&&!isNaN(cn)){
      if(cn>pn)el.classList.add("progress");
      else if(cn===pn)el.classList.add("stalled");
      else el.classList.add("regress");
    }
  }
}

// Feature 2: Rest timer popup
function showRestPopup(seconds,exerciseName){
  if(seconds<=0)return;
  const ov=document.getElementById("ovl");
  const circ=2*Math.PI*90;
  ov.innerHTML='<div class="timer-overlay" id="restPopup"><div class="timer-label">Rest — '+exerciseName+'</div><div class="timer-ring"><svg viewBox="0 0 200 200"><circle class="bg-ring" cx="100" cy="100" r="90"/><circle class="fg-ring" id="timerArc" cx="100" cy="100" r="90" stroke-dasharray="'+circ+'" stroke-dashoffset="0"/></svg><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"><span class="big-time" id="popTime">'+fmtRest(seconds)+'</span></div></div><button class="skip-btn" onclick="skipRest()">Skip rest</button></div>';
  ov.style.display="block";
  restPopupSec=seconds;restPopupTotal=seconds;
  restPopupInt=setInterval(()=>{
    restPopupSec--;
    if(restPopupSec<=0){skipRest();return}
    const el=document.getElementById("popTime");if(el)el.textContent=fmtRest(restPopupSec);
    const arc=document.getElementById("timerArc");
    if(arc){const off=circ*(1-restPopupSec/restPopupTotal);arc.style.strokeDashoffset=off}
  },1000);
}
let restPopupInt=null,restPopupSec=0,restPopupTotal=0;
function skipRest(){clearInterval(restPopupInt);restPopupInt=null;const ov=document.getElementById("ovl");ov.style.display="none";ov.innerHTML=""}

function completeSet(ei,si,restSec,btn){
  const wk=wlk(cD);
  if(!S.wlogs[wk])S.wlogs[wk]={};if(!S.wlogs[wk][ei])S.wlogs[wk][ei]={};if(!S.wlogs[wk][ei][si])S.wlogs[wk][ei][si]={};
  S.wlogs[wk][ei][si].done=true;btn.classList.add("done");sv();
  // Auto-fill from inputs if not already saved
  const row=btn.closest(".set-row");
  if(row){
    const inputs=row.querySelectorAll(".set-input");
    if(inputs[0]&&inputs[0].value&&!S.wlogs[wk][ei][si].lbs){S.wlogs[wk][ei][si].lbs=inputs[0].value;sv()}
    if(inputs[1]&&inputs[1].value&&!S.wlogs[wk][ei][si].reps){S.wlogs[wk][ei][si].reps=inputs[1].value;sv()}
  }
  const e=gx(cDay().exercises[ei]?.exId);
  if(restSec>0)showRestPopup(restSec,e?e.n:"");
}

// Feature 5: Workout start/end timestamps
function startWorkout(){
  const wk=wlk(cD);
  if(!S.wlogs[wk])S.wlogs[wk]={};
  if(!S.wlogs[wk]._meta)S.wlogs[wk]._meta={};
  S.wlogs[wk]._meta.startTime=Date.now();
  sv();rExec();
}

let wkClockInt=null;
function startWkClock(){
  clearInterval(wkClockInt);
  wkClockInt=setInterval(()=>{
    const wk=wlk(cD);const meta=S.wlogs[wk]?._meta;
    if(!meta||!meta.startTime)return;
    const el=document.getElementById("wkTimer");
    if(el)el.textContent="⏱ "+fmtElapsed(meta.startTime);
  },1000);
}

function fmtElapsed(startMs){
  const diff=Math.floor((Date.now()-startMs)/1000);
  const h=Math.floor(diff/3600);const m=Math.floor((diff%3600)/60);const s=diff%60;
  if(h>0)return h+":"+(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  return m+":"+(s<10?"0":"")+s;
}

function endWorkout(){
  const wk=wlk(cD);
  if(!S.wlogs[wk])S.wlogs[wk]={};
  if(!S.wlogs[wk]._meta)S.wlogs[wk]._meta={};
  S.wlogs[wk]._meta.endTime=Date.now();
  const startT=S.wlogs[wk]._meta.startTime||Date.now();
  const duration=Math.floor((Date.now()-startT)/1000);
  clearInterval(wkClockInt);
  // Save to log
  S.log.push({
    date:tds(),dayIdx:cD,label:cDay().label,
    weights:JSON.parse(JSON.stringify(S.wlogs[wk]||{})),
    startTime:startT,endTime:Date.now(),duration:duration
  });
  sv();
  const mins=Math.floor(duration/60);
  alert("Workout saved: "+cDay().label+"\nDuration: "+mins+" minutes");
  rExec();
}

function fmtRest(s){if(s>=60){const m=Math.floor(s/60);const sec=s%60;return m+":"+(sec<10?"0":"")+sec}return s+"s"}
// Old timer removed - replaced by per-set rest popup
function swP(p){curMode=p;document.querySelectorAll(".pb").forEach(b=>b.classList.remove("a"));event.target.closest(".pb").classList.add("a");rView()}

init();
